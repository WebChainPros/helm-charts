# Complete Monitoring Stack: Postgres Exporter + Prometheus + Grafana
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: firefly
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    scrape_configs:
      - job_name: 'firefly-core'
        static_configs:
          - targets: ['firefly:6000']

      - job_name: 'postgres-exporter'
        static_configs:
          - targets: ['firefly-postgres-exporter:9187']

      - job_name: 'evmconnect-meta'
        static_configs:
          - targets: ['firefly-evmconnect:5000']

      - job_name: 'evmconnect-amoy'
        static_configs:
          - targets: ['evmconnect-amoy:5008']

      - job_name: 'evmconnect-sepolia'
        static_configs:
          - targets: ['evmconnect-sepolia:5008']
---
# 1. Prometheus Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: firefly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.45.0
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: firefly
spec:
  ports:
    - port: 9090
      targetPort: 9090
      name: http
  selector:
    app: prometheus

---
# 2. Postgres Exporter Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefly-postgres-exporter
  namespace: firefly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: firefly-postgres-exporter
  template:
    metadata:
      labels:
        app: firefly-postgres-exporter
    spec:
      containers:
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DATA_SOURCE_NAME
              value: "postgresql://firefly:firefly-password@firefly-postgres:5432/firefly?sslmode=disable"
          ports:
            - containerPort: 9187
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: firefly-postgres-exporter
  namespace: firefly
spec:
  ports:
    - port: 9187
      targetPort: 9187
      name: http
  selector:
    app: firefly-postgres-exporter

---
---
# 3. Grafana Datasource & Dashboard Provisioning ConfigMaps (영속화 매니페스트)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: firefly
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: firefly
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'Firefly Dashboards'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: firefly
data:
  firefly-nodes-nonce.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": 1,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "title": "노드별 최신 Nonce & Block Listener 상태 (Node Nonce Tracking)",
          "type": "stat",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "editorMode": "code",
              "expr": "max(pg_stat_database_xact_commit{datname=\"firefly\"}) by (datname)",
              "legendFormat": "Database Transactions Committed",
              "range": true,
              "refId": "A"
            }
          ]
        },
        {
          "title": "노드별 Nonce / Pending 수량 & Policy Loop 버퍼 (Pending Buffer)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "id": 2,
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "sum(rate(pg_stat_database_xact_commit{datname=\"firefly\"}[1m]))",
              "legendFormat": "TPS (Committed Tx/sec)",
              "refId": "A"
            }
          ]
        },
        {
          "title": "PostgreSQL DB Connections Pool (Max 400)",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "id": 3,
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "Prometheus" },
              "expr": "pg_stat_database_numbackends{datname=\"firefly\"}",
              "legendFormat": "Active DB Connections",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["firefly", "nonce"],
      "time": { "from": "now-15m", "to": "now" },
      "timepicker": {},
      "timezone": "",
      "title": "FireFly 멀티체인 노드 논스(Nonce) & TPS 모니터링",
      "uid": "firefly-nonce-overview"
    }
---
# 4. Grafana Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: firefly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          ports:
            - containerPort: 3000
              name: http
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-providers
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: firefly
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: grafana
