apiVersion: v1
kind: ConfigMap
metadata:
  name: firefly-ui-proxy-config
  namespace: firefly
data:
  nginx.conf: |
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      server {
        listen 5000;
        
        # UI 프론트엔드 정적파일 서빙 (/ui 및 /ui/)
        location /ui/ {
          alias /usr/share/nginx/html/;
          try_files $uri $uri/ /ui/index.html;
        }
        location /ui {
          return 301 /ui/;
        }
        
        # FireFly Core REST API & WebSocket 라우팅
        location / {
          proxy_pass http://firefly:5000;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefly-ui-proxy
  namespace: firefly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: firefly-ui-proxy
  template:
    metadata:
      labels:
        app: firefly-ui-proxy
    spec:
      containers:
        - name: nginx
          image: ghcr.io/webchainpro-cpu/firefly-custom-ui:v8
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: config
          configMap:
            name: firefly-ui-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: firefly-ui-proxy
  namespace: firefly
spec:
  type: LoadBalancer
  ports:
    - port: 5000
      targetPort: 5000
      name: http
  selector:
    app: firefly-ui-proxy
