data:
  config.yaml: |
    log:
      level: debug
    connector:
      url: https://ethereum-sepolia.nodit.io/VOYo9mfc4s-AlOOgenk1WqbTEHvhKeYG
      events:
        filterPollingInterval: 30s
        catchupPageSize: 250
        catchupThreshold: 250
