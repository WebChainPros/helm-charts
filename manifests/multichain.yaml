---
# 3. EVMConnect for Polygon Amoy
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evmconnect-amoy
  namespace: firefly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evmconnect-amoy
  template:
    metadata:
      labels:
        app: evmconnect-amoy
    spec:
      containers:
        - name: evmconnect
          image: ghcr.io/webchainpro-cpu/evmconnect:head
          imagePullPolicy: IfNotPresent
          args:
            - "-f"
            - "/evmconnect/config.yaml"
          env:
            - name: ETHCONNECT_CHAIN_ID
              value: "80002"
            - name: ETHCONNECT_FIRST_EVENT_BLOCK
              value: "-20"
            - name: EVMCONNECT_CONNECTOR_USEGETBLOCKRECEIPTS
              value: "true"
            - name: TZ
              value: "Asia/Seoul"
          ports:
            - containerPort: 5008
              name: http
          volumeMounts:
            - name: config
              mountPath: /evmconnect/config.yaml
              subPath: config.yaml
      volumes:
        - name: config
          configMap:
            name: evmconnect-amoy-config
---
apiVersion: v1
kind: Service
metadata:
  name: evmconnect-amoy
  namespace: firefly
spec:
  ports:
    - port: 5008
      targetPort: 5008
      name: http
  selector:
    app: evmconnect-amoy

