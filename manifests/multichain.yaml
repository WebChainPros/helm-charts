---
# 1. Web3Signer for Polygon Amoy (Chain ID 80002)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web3signer-amoy
  namespace: firefly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web3signer-amoy
  template:
    metadata:
      labels:
        app: web3signer-amoy
    spec:
      containers:
        - name: web3signer
          image: consensys/web3signer:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--http-listen-port=9000"
            - "--http-host-allowlist=*"
            - "eth1"
            - "--chain-id=80002"
            - "--keystores-path=/opt/web3signer/keystores"
            - "--keystores-passwords-path=/opt/web3signer/passwords"
            - "--downstream-http-host=host.docker.internal"
            - "--downstream-http-port=8545"
          env:
            - name: TZ
              value: "Asia/Seoul"
            - name: WEB3SIGNER_OPTS
              value: "-Dvertx.workerPoolSize=200 -Dvertx.eventLoopPoolSize=64 -Xmx3500m -Xms1500m"
          ports:
            - containerPort: 9000
              name: http
          volumeMounts:
            - name: keystores
              mountPath: /opt/web3signer/keystores
              readOnly: true
            - name: passwords
              mountPath: /opt/web3signer/passwords
              readOnly: true
      volumes:
        - name: keystores
          secret:
            secretName: web3signer-keystores
        - name: passwords
          secret:
            secretName: web3signer-passwords
---
apiVersion: v1
kind: Service
metadata:
  name: web3signer-amoy
  namespace: firefly
spec:
  ports:
    - port: 9000
      targetPort: 9000
      name: http
  selector:
    app: web3signer-amoy

