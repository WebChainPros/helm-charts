# Amoy & Sepolia Multichain Complete ConfigMaps, Deployments, and Services
# 100% matched with /home/joon/.firefly/stacks/dev_15/

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: evmconnect-amoy-config
  namespace: firefly
data:
  config.yaml: |
    log:
      level: debug
    connector:
      url: https://polygon-amoy-bor-rpc.publicnode.com
      events:
        filterPollingInterval: 30s
        catchupPageSize: 250
        catchupThreshold: 250
        checkpointBlockGap: 9
      throttle:
        requestsPerSecond: 15
        burst: 30
      txSigner:
        enabled: true
        type: web3signer
        web3signer:
          url: http://web3signer-amoy:9000
    persistence:
      type: postgres
      postgres:
        url: postgres://firefly:firefly-password@firefly-postgres:5432/firefly?sslmode=disable&search_path=evm_amoy
        migrations:
          auto: true
        options:
          "-c search_path=evm_amoy"
    ffcore:
      url: http://firefly:5000
      namespaces:
        - amoy
    confirmations:
      required: 0
    transactions:
      handler:
        name: simple
        simple:
          fixedGasPrice: '{"maxFeePerGas": "123456789012", "maxPriorityFeePerGas": "2000000000"}'
          gasOracle:
            mode: fixed
          resubmitInterval: 10s
    api:
      port: 5008
      address: 0.0.0.0
      publicURL: http://127.0.0.1:5112
    eventstreams:
      defaults:
        batchSize: 20

---
apiVersion: v1
