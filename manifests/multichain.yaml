      labels:
        app: tokens-amoy
    spec:
      containers:
        - name: tokens
          image: ghcr.io/hyperledger/firefly-tokens-erc20-erc721:v1.3.7
          imagePullPolicy: IfNotPresent
          env:
            - name: ETHCONNECT_URL
              value: "http://evmconnect-amoy:5008"
            - name: ETHCONNECT_TOPIC
              value: "tokens_amoy"
            - name: TZ
              value: "Asia/Seoul"
          ports:
            - containerPort: 3000
              name: http
