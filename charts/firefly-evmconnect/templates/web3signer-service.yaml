{{- if .Values.web3signer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "firefly-evmconnect.web3signerFullname" . }}
  labels:
    {{- include "firefly-evmconnect.web3signerLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 9000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "firefly-evmconnect.web3signerSelectorLabels" . | nindent 4 }}
{{- end }}
