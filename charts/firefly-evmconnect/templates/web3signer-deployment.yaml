{{/*
  Web3Signer Deployment with Keystores/Passwords Volume Mounts & JVM Worker Pool Tuning
*/}}
{{- if .Values.web3signer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "firefly-evmconnect.fullname" . }}-web3signer
  labels:
    {{- include "firefly-evmconnect.web3signerLabels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "firefly-evmconnect.web3signerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "firefly-evmconnect.web3signerSelectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: web3signer
          image: "{{ .Values.web3signer.image.repository }}:{{ .Values.web3signer.image.tag }}"
          imagePullPolicy: {{ .Values.web3signer.image.pullPolicy }}
          args:
            - "--http-listen-port=9000"
            - "--http-host-allowlist=*"
            - "eth1"
            - "--chain-id=202607"
            - "--keystores-path=/opt/web3signer/keystores"
            - "--keystores-passwords-path=/opt/web3signer/passwords"
            - "--downstream-http-host={{ .Values.config.besuExternalHost | default "host.docker.internal" }}"
            - "--downstream-http-port=8545"
          env:
            - name: TZ
              value: "Asia/Seoul"
            - name: WEB3SIGNER_OPTS
              value: "-Dvertx.workerPoolSize=200 -Dvertx.eventLoopPoolSize=64 -Xmx3500m -Xms1500m"
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          volumeMounts:
            - name: keystores
              mountPath: /opt/web3signer/keystores
              readOnly: true
            - name: passwords
              mountPath: /opt/web3signer/passwords
              readOnly: true
      volumes:
        - name: keystores
          secret:
            secretName: web3signer-keystores
        - name: passwords
          secret:
            secretName: web3signer-passwords
{{- end }}
