fullnameOverride: ""

service:
  type: ClusterIP
  port: 5000

podAnnotations: {}

imagePullSecrets: []

podSecurityContext:
  fsGroup: 1001

securityContext: {}

extraEnv: []

initContainers: ""
extraContainers: ""
extraVolumeClaimTemplates: ""

resources: {}

nodeSelector: {}

affinity: {}

tolerations: {}

persistentVolume:
  accessModes:
    - ReadWriteOnce
  annotations: {}
  size: 2Gi
  storageClass: ""

image:
  repository: ghcr.io/hyperledger-firefly/evmconnect
  pullPolicy: IfNotPresent
  tag: "v1.5.1"

# see https://github.com/hyperledger-firefly/evmconnect/blob/main/config.md for more info
config:
  jsonRpcUrl: ""

  log:
    level: debug
    jsonEnabled: false

  confirmations:
    required: 0
    # blockQueueLength: 50
    # staleReceiptTimeout: 1m
    # notificationQueueLength: 50

  persistence:
    type: leveldb
    leveldb:
      maxHandles: 100
      syncWrites: false
    templateOverride: ""

  connector: |
    url: {{ .Values.config.jsonRpcUrl | quote }}

  policyEngine: ""

  policyLoop: {}

  transactions: {}

  webhooks: {}

  eventstreams: {}

# Configures the Web3Signer service for REST-based signing (sign-only mode)
web3signer:
  enabled: false

  image:
    repository: consensys/web3signer
    tag: latest
    pullPolicy: IfNotPresent

  imagePullSecrets: []

  # The chain ID of the blockchain network (required)
  chainId: 1337

  # Downstream Besu/Geth node host (used by web3signer proxy internally)
  downstreamHttpHost: "127.0.0.1"
  downstreamHttpPort: 8545

  # Host paths for keystore and password files (hostPath mount)
  # These directories must exist on the node running the pod
  keystoresHostPath: "/opt/web3signer/keystores"
  passwordsHostPath: "/opt/web3signer/passwords"

  resources: {}

  nodeSelector: {}
  tolerations: []
  affinity: {}
