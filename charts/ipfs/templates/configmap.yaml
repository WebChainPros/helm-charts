apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ipfs.fullname" . }}-container-init
  labels:
    {{- include "ipfs.labels" . | nindent 4 }}
data:
  001-disable-autoconf.sh: |-
    #!/bin/sh
    # This node runs on a private swarm (LIBP2P_FORCE_PNET / swarm.key), so
    # Kubo's AutoConf feature must not reach out to the public mainnet
    # config service - it refuses to start otherwise. With AutoConf disabled,
    # the "auto" placeholders `ipfs init` writes into these fields by default
    # have nothing to resolve to, so clear them - a private swarm has no use
    # for public bootstrap peers, DNS resolvers, or delegated routing anyway.
    ipfs config --json AutoConf.Enabled false
    ipfs config --json Bootstrap '[]'
    ipfs config --json DNS.Resolvers '{}'
    ipfs config --json Routing.DelegatedRouters '[]'
    ipfs config --json Ipns.DelegatedPublishers '[]'
