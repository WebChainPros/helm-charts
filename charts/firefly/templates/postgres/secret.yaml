{{/*
  PostgreSQL Secret for FireFly
*/}}
{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "firefly.fullname" . }}-postgres-secret
  labels:
    {{- include "firefly.coreLabels" . | nindent 4 }}
stringData:
  postgres-password: {{ .Values.postgresql.password | quote }}
  postgres-user: {{ .Values.postgresql.user | quote }}
  postgres-db: {{ .Values.postgresql.database | quote }}
{{- end }}
